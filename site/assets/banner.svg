<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="OpenClaw Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026"/><stop offset="55%" stop-color="#005e62"/><stop offset="100%" stop-color="#0ea5a5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="46" fill="#ffd166" opacity="0.9">
    <animate attributeName="cy" values="70;58;70" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="250" r="28" fill="#ffffff" opacity="0.25">
    <animate attributeName="cy" values="250;238;250" dur="5s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 240 Q 300 200 600 240 T 1200 230" fill="none" stroke="#ffd166" stroke-width="4" opacity="0.7">
    <animate attributeName="d" values="M0 240 Q 300 200 600 240 T 1200 230;M0 240 Q 300 220 600 250 T 1200 240;M0 240 Q 300 200 600 240 T 1200 230" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">OpenClaw Guide</text>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="28" fill="#e6fffa">VPS • Custom Base URL • GUI • Telegram • Windows • Linux • Browser</text>
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="22" fill="#ffd166">Self-hosted AI agent — for everyone</text>
</svg>
